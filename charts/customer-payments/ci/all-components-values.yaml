# Used by `helm lint` / `ct lint`: every optional value and component set at
# once (api + mcp + mcp route + HPA + gateway + ingress).
database:
  url: "postgres://u@example.invalid:5432/db"
  migrationsUrl: "postgres://u@example.invalid:5432/direct"
  existingSecretKey: "DATABASE_URL"
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
kafka:
  brokers: "kafka.example.invalid:9092"
config:
  logLevel: "debug"
  paymentProviderUrl: "http://payment-provider.example.invalid"
  outboxRelayInterval: "2s"
  policyInterval: "3s"
  outboxMaxAttempts: 20
  shutdownDrainDelay: "5s"
  checkoutConsumerGroup: "customer-payments-checkout"
  orderSourcingConsumerGroup: "customer-payments-order-sourcing"
  shippingAndTrackingConsumerGroup: "customer-payments-shipping-and-tracking"
autoscaling:
  api:
    enabled: true
ingress:
  enabled: true
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/customer-payments
      pathType: PathPrefix
mcp:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
