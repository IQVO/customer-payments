{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the fleet gateway (Kong). Host contract:
/api/mcp/<context> -> Service <context>-mcp:8090, prefix rewritten to /mcp
(the SDK's canonical endpoint of cmd/mcp; /healthz deliberately stays off the
host -- it is a Kubernetes probe concern, not a public endpoint). The
parentRef comes from values (warehouse-infra supplies the Gateway).

NO auth plugin and no auth of any kind on this route: the endpoints are
unauthenticated by fleet-wide decision.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "customer-payments.mcpFullname" . }}
  labels:
    {{- include "customer-payments.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "customer-payments.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
