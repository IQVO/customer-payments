{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-ordering.mcpFullname" . }}
  labels:
    {{- include "customer-ordering.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=mcp pins the Service to the mcp Deployment's pods only
  # (tests/test_service_selectors.py): the read-only MCP server, never the
  # api or the frontend.
  selector:
    {{- include "customer-ordering.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
