# Default values for customer-payments. Two components: the api Deployment
# (cmd/api: REST, the outbox relay, three Kafka consumers and the clock-driven
# policy loop in one process) and the optional, read-only mcp Deployment
# (cmd/mcp, default off). The chart refuses to render without the mandatory
# values below (named in the failure): database.*, kafka.brokers,
# config.paymentProviderUrl and the three config.*ConsumerGroup ids.

replicaCount: 1

# The image is built from this repository's Dockerfile (api on 8080, mcp on
# 8090, user 1000, root filesystem never written).
image:
  repository: warehouse/customer-payments
  pullPolicy: IfNotPresent
  # Empty = "v" + the chart's appVersion (the release job tags the image v<version>).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile USER 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Optional exposure, default off. Both route to the api Service only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: customer-payments.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), default off. When enabled the
# Deployment omits replicas so the HPA owns them. N>1 is safe for the outbox
# relay (row claims), the version-guarded writes and the consumers (stable
# groups, inbox dedupe on the CloudEvents id in the same transaction); it has
# not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go, cmd/api/main.go,
# cmd/api/policies.go). Every key maps 1:1 to one variable; nothing else is
# rendered.
config:
  httpAddr: ":8080"                    # HTTP_ADDR (its port must equal service.targetPort)
  logLevel: "info"                     # LOG_LEVEL: debug | info | warn (or warning) | error
  # PAYMENT_PROVIDER_URL: base URL of the payment provider, the one synchronous
  # dependency (authorize, capture, void, refund, reauthorize). REQUIRED.
  paymentProviderUrl: ""
  # The three consumers always run, each under a STABLE, service-prefixed group
  # id that comes from here, never from the pod name (a rescheduled pod must
  # resume from its committed offsets). All REQUIRED; the chart refuses an empty
  # one and refuses *_CONSUMER_GROUP in extraEnv. Suggested:
  # customer-payments-checkout, customer-payments-order-sourcing,
  # customer-payments-shipping-and-tracking.
  checkoutConsumerGroup: ""             # CHECKOUT_CONSUMER_GROUP
  orderSourcingConsumerGroup: ""        # ORDER_SOURCING_CONSUMER_GROUP
  shippingAndTrackingConsumerGroup: ""  # SHIPPING_AND_TRACKING_CONSUMER_GROUP
  # OUTBOX_RELAY_INTERVAL: Go duration or plain seconds. Empty = not rendered
  # (the binary defaults to 1s).
  outboxRelayInterval: ""
  # POLICY_INTERVAL: how often the clock-driven policies (re-authorization of
  # uncaptured allocations before the provider's validity expires) run. Empty =
  # not rendered; the binary defaults to 5s.
  policyInterval: ""
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes an outbox row so a
  # poison row cannot block it; re-arm with
  # `UPDATE outbox_events SET attempts = 0 WHERE id = ...`. 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before the listener closes.
  # Empty = not rendered (the binary defaults to 5s). Whole seconds ("5s"),
  # minutes ("1m") or "0"; the chart needs the number to size the grace period.
  shutdownDrainDelay: ""

# The chart refuses to render unless database.url or database.existingSecret is
# set. DATABASE_URL always comes from a Secret (secretKeyRef), never from the
# ConfigMap.
database:
  # A DSN the chart stores in a Secret it creates. Prefer existingSecret.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same Secret, of a DIRECT (non-pooled, session-mode) DSN used only
  # for the boot migrations (MIGRATIONS_DATABASE_URL), `optional: true` so a
  # Secret without it still starts the pod (the binary falls back to
  # DATABASE_URL). With database.url set, migrationsUrl fills it.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
  migrationsUrl: ""

# KAFKA_BROKERS (comma-separated) is MANDATORY: outbox relay, the three
# consumers and /readyz dial Kafka. Produced topic:
# retailnetwork.customer-payments.events; consumed:
# retailnetwork.checkout.events, retailnetwork.order-sourcing.events and
# retailnetwork.shipping-and-tracking.events (dead letters on <topic>.dlq).
kafka:
  brokers: ""

# Observability (ADR 0004): the fleet pipeline is pod --OTLP/gRPC--> Collector
# --> Jaeger (traces) and Prometheus (metrics); logs are stdout JSON for Alloy
# and Loki. Export never blocks, so a Collector that is down costs telemetry and
# nothing else, but otel.enabled=false renders no OTEL_* env at all (the binaries
# then fall back to localhost:4317). serviceName is OTEL_SERVICE_NAME of the api;
# the mcp component gets "<serviceName>-mcp". SERVICE_VERSION is the image tag
# (appVersion when empty), ENVIRONMENT is `environment`.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "customer-payments"

# ENVIRONMENT of the api: deployment.environment.name on every span, metric and
# log of the api. (mcp.environment sets the same for the mcp component.)
environment: "production"

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable (this service has no mode: Postgres and Kafka are the only
# runtime), any variable the chart renders itself and any *_CONSUMER_GROUP (the
# group ids are config.* values).
extraEnv: []

# The Postgres dial and the migrations at boot run inside a bounded retry
# (internal/bootretry), so the startup probe allows ~60s.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown (cmd/api/main.go
# serveUntilSignal): SHUTDOWN_DRAIN_DELAY (5s) + HTTP drain (10s) + the four
# workers awaited up to 10s one after the other (three consumers + the policy
# loop, 40s) + the outbox relay (10s) = 65s worst case. The chart refuses
# anything that does not exceed that sum for the configured drain delay (a
# shorter period SIGKILLs a worker or the relay mid-drain).
terminationGracePeriodSeconds: 70

# The optional MCP server: cmd/mcp, a read-only second deployable over the
# SAME read use cases the REST adapter serves, on /mcp (Streamable HTTP,
# :8090). Never dials Kafka, runs no consumer, no relay and no policy loop,
# calls no sibling context and no payment provider, and has NO auth (fleet-wide
# revert 2026-09-11): access control is the in-cluster ClusterIP boundary.
# Needs database.* like the api (the same Secret), nothing else.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"                  # MCP_ADDR (Streamable HTTP /mcp + /healthz)
  # SERVICE_VERSION / ENVIRONMENT: the labels cmd/mcp reports at boot.
  # serviceVersion empty = the image tag (appVersion when empty), like the api;
  # set it only to override.
  serviceVersion: ""
  environment: "production"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Gateway exposure: /api/mcp/customer-payments -> Service :8090, prefix
  # rewritten to /mcp (the SDK's canonical endpoint). Needs the Gateway
  # parentRef from warehouse-infra; NO auth of any kind on the route.
  route:
    enabled: false
    path: "/api/mcp/customer-payments"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# The optional A2A agent: cmd/a2a, a read-only third deployable (ADR 0005) over
# the SAME read use cases the REST and MCP adapters serve, speaking Agent2Agent
# JSON-RPC on / and /a2a with the Agent Card at /.well-known/agent-card.json
# (:8093; 8090 is the MCP server). Never dials Kafka, runs no consumer, no relay
# and no policy loop, calls no sibling context and no payment provider, and has
# NO auth (fleet-wide revert 2026-09-11): access control is the in-cluster
# ClusterIP boundary. Needs database.* like the api (the same Secret), nothing
# else.
a2a:
  enabled: false
  replicaCount: 1
  httpAddr: ":8093"                  # A2A_ADDR; keep in sync with service.targetPort
  # Absolute URL advertised on the Agent Card (A2A_AGENT_URL, mandatory in the
  # binary). Empty defaults to this release's in-cluster Service DNS
  # (http://<release>-a2a.<ns>.svc.cluster.local:8093/); warehouse-infra can
  # override it with the gateway URL when the agent must be reachable
  # off-cluster.
  agentUrl: ""
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Gateway exposure: /api/a2a/customer-payments -> Service :8093, prefix
  # rewritten to / (JSON-RPC root; the well-known agent card stays reachable
  # under the same prefix). Off by default; needs the Gateway parentRef from
  # warehouse-infra; NO auth of any kind on the route.
  route:
    enabled: false
    path: "/api/a2a/customer-payments"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
