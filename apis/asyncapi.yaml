asyncapi: 3.0.0
info:
  title: customer-payments Domain Events
  version: 1.0.0
  contact:
    name: customer-payments maintainers
    url: https://github.com/IQVO/customer-payments
    email: customer-payments@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
  - name: customer-payments
    description: The customer-payments bounded context (storefront domain, Generic subdomain).
  - name: consumed
    description: Events produced by sibling contexts that this service consumes.
  description: |-
    Event catalog for the **customer-payments** bounded context of the storefront domain: it authorizes a checkout session's payment at the provider, captures or releases each shipment group's allocation as fulfilment facts arrive, and refunds lost or returned packages. The service stores PSP tokens only, never a card number.

    **Published.** Eight events on `retailnetwork.customer-payments.events` through a **transactional outbox** (state and already-encoded events are written in ONE database transaction; an always-on relay drains them to Kafka, at-least-once, the CloudEvents `id` is stored with the outbox row). Every published event is analytics-only by design for its consumers (no sibling reacts to them).

    **Consumed.** CheckoutCompleted from checkout, FulfillmentShipped, FulfillmentCancelled and FulfillmentUnsourceable from order-sourcing, PackageLost and PackageReturned from shipping-and-tracking. Facts for an order that is not yet bound are parked and applied when CheckoutCompleted binds the order; facts still unknown after 24 hours are dead-lettered with an alert. Messages list only the fields this service relies on; unknown fields are ignored. Each consumer group name comes from a mandatory environment variable.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json; charset=UTF-8`. `specversion`, `id`, `source` (`/retailnetwork/customer-payments`), `type`, `subject` (authorizationId, or refundId for refund events), `time`, `datacontenttype` (`application/json`) and `dataschema` (`urn:retailnetwork:customer-payments:events:<EventName>:v1`) are all required. Kafka key = the subject. Type = `com.retailnetwork.storefront.customer-payments.<entity>.<EventName>`. A breaking payload change is a new `.v2` type, never a mutation. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.

    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; amounts are integer minor units; enums are UPPER_SNAKE; optional fields are omitted when absent (never null).
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: Retail-network Kafka broker (host supplied by the deployment environment via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  customerPaymentsEvents:
    address: retailnetwork.customer-payments.events
    title: customer-payments integration topic
    description: This service's integration topic. Written by the outbox relay; key = subject. Every message carries the CloudEvents content-type header.
    messages:
      PaymentAuthorized:
        $ref: '#/components/messages/PaymentAuthorized'
      PaymentCaptured:
        $ref: '#/components/messages/PaymentCaptured'
      PaymentReleased:
        $ref: '#/components/messages/PaymentReleased'
      PaymentAuthorizationExpired:
        $ref: '#/components/messages/PaymentAuthorizationExpired'
      PaymentDeclined:
        $ref: '#/components/messages/PaymentDeclined'
      PaymentReauthorized:
        $ref: '#/components/messages/PaymentReauthorized'
      RefundIssued:
        $ref: '#/components/messages/RefundIssued'
      RefundFailed:
        $ref: '#/components/messages/RefundFailed'
  checkoutEvents:
    address: retailnetwork.checkout.events
    title: checkout integration topic (consumed)
    description: Produced by checkout; consumed with its own consumer group. Idempotent on the CloudEvents id (inbox), dispatch on the full type, dead-letter on poison messages.
    messages:
      CheckoutCompleted:
        $ref: '#/components/messages/ConsumedCheckoutCompleted'
  orderSourcingEvents:
    address: retailnetwork.order-sourcing.events
    title: order-sourcing integration topic (consumed)
    description: Produced by order-sourcing; consumed with its own consumer group. Facts for an unbound order are parked, then applied on bind.
    messages:
      FulfillmentShipped:
        $ref: '#/components/messages/ConsumedFulfillmentShipped'
      FulfillmentCancelled:
        $ref: '#/components/messages/ConsumedFulfillmentCancelled'
      FulfillmentUnsourceable:
        $ref: '#/components/messages/ConsumedFulfillmentUnsourceable'
  shippingAndTrackingEvents:
    address: retailnetwork.shipping-and-tracking.events
    title: shipping-and-tracking integration topic (consumed)
    description: Produced by shipping-and-tracking; consumed with its own consumer group. Refund by tracking number.
    messages:
      PackageLost:
        $ref: '#/components/messages/ConsumedPackageLost'
      PackageReturned:
        $ref: '#/components/messages/ConsumedPackageReturned'
operations:
  publishCustomerPaymentsEvents:
    action: send
    title: Publish customer-payments events
    summary: Publish the eight payment and refund events through the transactional outbox.
    description: The service sends the events of the PaymentAuthorization and Refund aggregates to `retailnetwork.customer-payments.events`. Consumers route on the full `type`.
    tags:
    - name: customer-payments
    channel:
      $ref: '#/channels/customerPaymentsEvents'
    messages:
    - $ref: '#/channels/customerPaymentsEvents/messages/PaymentAuthorized'
    - $ref: '#/channels/customerPaymentsEvents/messages/PaymentCaptured'
    - $ref: '#/channels/customerPaymentsEvents/messages/PaymentReleased'
    - $ref: '#/channels/customerPaymentsEvents/messages/PaymentAuthorizationExpired'
    - $ref: '#/channels/customerPaymentsEvents/messages/PaymentDeclined'
    - $ref: '#/channels/customerPaymentsEvents/messages/PaymentReauthorized'
    - $ref: '#/channels/customerPaymentsEvents/messages/RefundIssued'
    - $ref: '#/channels/customerPaymentsEvents/messages/RefundFailed'
  receiveCheckoutEvents:
    action: receive
    title: Receive checkout events
    summary: Consume CheckoutCompleted from checkout.
    description: CheckoutCompleted binds the order id to the session's authorization and applies any parked fulfilment facts.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/checkoutEvents'
    messages:
    - $ref: '#/channels/checkoutEvents/messages/CheckoutCompleted'
  receiveOrderSourcingEvents:
    action: receive
    title: Receive order-sourcing events
    summary: Consume FulfillmentShipped, FulfillmentCancelled, FulfillmentUnsourceable from order-sourcing.
    description: Shipped captures the group's allocation and records the tracking number; Cancelled and Unsourceable release it. Facts for an unbound order are parked.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/orderSourcingEvents'
    messages:
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentShipped'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentCancelled'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentUnsourceable'
  receiveShippingAndTrackingEvents:
    action: receive
    title: Receive shipping-and-tracking events
    summary: Consume PackageLost and PackageReturned from shipping-and-tracking.
    description: Each event refunds the captured allocation identified by the tracking number (reason LOST or RETURNED_TO_SENDER).
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/shippingAndTrackingEvents'
    messages:
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageLost'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageReturned'
components:
  messages:
    PaymentAuthorized:
      name: PaymentAuthorized
      title: PaymentAuthorized
      summary: PaymentAuthorized event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.paymentauthorization.PaymentAuthorized`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - authorizationId
        - checkoutSessionId
        - currency
        - totalMinor
        - allocations
        - expiresAt
        properties:
          authorizationId:
            type: string
          checkoutSessionId:
            type: string
          currency:
            type: string
          totalMinor:
            type: integer
            minimum: 0
          expiresAt:
            type: string
            format: date-time
          allocations:
            type: array
            items:
              type: object
      examples:
      - name: example
        payload:
          authorizationId: pay-1
          checkoutSessionId: cs-1
          currency: BRL
          totalMinor: 10000
          expiresAt: '2026-10-31T09:00:00Z'
          allocations: [{groupNo: 1, amountMinor: 7000}, {groupNo: 2, amountMinor: 3000}]
    PaymentCaptured:
      name: PaymentCaptured
      title: PaymentCaptured
      summary: PaymentCaptured event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.paymentauthorization.PaymentCaptured`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - authorizationId
        - groupNo
        - amountMinor
        properties:
          authorizationId:
            type: string
          orderId:
            type: string
          groupNo:
            type: integer
            minimum: 1
          amountMinor:
            type: integer
            minimum: 0
      examples:
      - name: example
        payload:
          authorizationId: pay-1
          orderId: ord-1
          groupNo: 1
          amountMinor: 7000
    PaymentReleased:
      name: PaymentReleased
      title: PaymentReleased
      summary: PaymentReleased event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.paymentauthorization.PaymentReleased`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - authorizationId
        - groupNo
        - amountMinor
        - reason
        properties:
          authorizationId:
            type: string
          orderId:
            type: string
          groupNo:
            type: integer
            minimum: 1
          amountMinor:
            type: integer
            minimum: 0
          reason:
            type: string
            enum: [CANCELLED, UNSOURCEABLE, VOIDED, EXPIRED]
      examples:
      - name: example
        payload:
          authorizationId: pay-1
          orderId: ord-1
          groupNo: 2
          amountMinor: 3000
          reason: CANCELLED
    PaymentAuthorizationExpired:
      name: PaymentAuthorizationExpired
      title: PaymentAuthorizationExpired
      summary: PaymentAuthorizationExpired event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.paymentauthorization.PaymentAuthorizationExpired`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - authorizationId
        - expiredAt
        properties:
          authorizationId:
            type: string
          orderId:
            type: string
          expiredAt:
            type: string
            format: date-time
      examples:
      - name: example
        payload:
          authorizationId: pay-1
          orderId: ord-1
          expiredAt: '2026-10-24T09:00:00Z'
    PaymentDeclined:
      name: PaymentDeclined
      title: PaymentDeclined
      summary: PaymentDeclined event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.paymentauthorization.PaymentDeclined`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - authorizationId
        - reason
        - at
        properties:
          authorizationId:
            type: string
          checkoutSessionId:
            type: string
          reason:
            type: string
          at:
            type: string
            format: date-time
      examples:
      - name: example
        payload:
          authorizationId: pay-1
          checkoutSessionId: cs-1
          reason: CARD_DECLINED
          at: '2026-10-24T09:00:00Z'
    PaymentReauthorized:
      name: PaymentReauthorized
      title: PaymentReauthorized
      summary: PaymentReauthorized event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.paymentauthorization.PaymentReauthorized`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - authorizationId
        - expiresAt
        - providerAuthorizationId
        properties:
          authorizationId:
            type: string
          orderId:
            type: string
          expiresAt:
            type: string
            format: date-time
          providerAuthorizationId:
            type: string
      examples:
      - name: example
        payload:
          authorizationId: pay-1
          orderId: ord-1
          expiresAt: '2026-11-07T09:00:00Z'
          providerAuthorizationId: hold-2
    RefundIssued:
      name: RefundIssued
      title: RefundIssued
      summary: RefundIssued event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.refund.RefundIssued`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - refundId
        - authorizationId
        - amountMinor
        - reason
        properties:
          refundId:
            type: string
          orderId:
            type: string
          authorizationId:
            type: string
          groupNo:
            type: integer
            minimum: 1
          amountMinor:
            type: integer
            minimum: 0
          reason:
            type: string
            enum: [LOST, RETURNED_TO_SENDER, MANUAL]
      examples:
      - name: example
        payload:
          refundId: ref-1
          orderId: ord-1
          authorizationId: pay-1
          groupNo: 1
          amountMinor: 7000
          reason: LOST
    RefundFailed:
      name: RefundFailed
      title: RefundFailed
      summary: RefundFailed event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.customer-payments.refund.RefundFailed`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - refundId
        - authorizationId
        - code
        - attempts
        - final
        properties:
          refundId:
            type: string
          orderId:
            type: string
          authorizationId:
            type: string
          groupNo:
            type: integer
            minimum: 1
          code:
            type: string
          attempts:
            type: integer
            minimum: 1
          final:
            type: boolean
      examples:
      - name: example
        payload:
          refundId: ref-1
          orderId: ord-1
          authorizationId: pay-1
          groupNo: 1
          code: ACCOUNT_CLOSED
          attempts: 5
          final: true
    ConsumedCheckoutCompleted:
      name: CheckoutCompleted
      title: Consumed CheckoutCompleted
      summary: ConsumedCheckoutCompleted event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.storefront.checkout.checkoutsession.CheckoutCompleted`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - sessionId
        - orderId
        - authorizationId
        properties:
          sessionId:
            type: string
          orderId:
            type: string
          authorizationId:
            type: string
      examples:
      - name: example
        payload:
          sessionId: cs-1
          orderId: ord-1
          authorizationId: pay-1
    ConsumedFulfillmentShipped:
      name: FulfillmentShipped
      title: Consumed FulfillmentShipped
      summary: ConsumedFulfillmentShipped event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentShipped`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - orderId
        - groupNo
        - trackingNumbers
        properties:
          orderId:
            type: string
          groupNo:
            type: integer
            minimum: 1
          trackingNumbers:
            type: array
            items:
              type: string
          shippedAt:
            type: string
            format: date-time
      examples:
      - name: example
        payload:
          orderId: ord-1
          groupNo: 1
          trackingNumbers: [TRK-1]
          shippedAt: '2026-10-24T09:00:00Z'
    ConsumedFulfillmentCancelled:
      name: FulfillmentCancelled
      title: Consumed FulfillmentCancelled
      summary: ConsumedFulfillmentCancelled event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentCancelled`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - orderId
        - groupNo
        properties:
          orderId:
            type: string
          groupNo:
            type: integer
            minimum: 1
      examples:
      - name: example
        payload:
          orderId: ord-1
          groupNo: 2
    ConsumedFulfillmentUnsourceable:
      name: FulfillmentUnsourceable
      title: Consumed FulfillmentUnsourceable
      summary: ConsumedFulfillmentUnsourceable event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentUnsourceable`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - orderId
        - groupNo
        properties:
          orderId:
            type: string
          groupNo:
            type: integer
            minimum: 1
      examples:
      - name: example
        payload:
          orderId: ord-1
          groupNo: 2
    ConsumedPackageLost:
      name: PackageLost
      title: Consumed PackageLost
      summary: ConsumedPackageLost event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.logistics.shipping-and-tracking.journey.PackageLost`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - trackingNumber
        properties:
          orderId:
            type: string
          trackingNumber:
            type: string
      examples:
      - name: example
        payload:
          orderId: ord-1
          trackingNumber: TRK-1
    ConsumedPackageReturned:
      name: PackageReturned
      title: Consumed PackageReturned
      summary: ConsumedPackageReturned event.
      description: CloudEvents 1.0 structured event of type `com.retailnetwork.logistics.shipping-and-tracking.journey.PackageReturned`.
      contentType: application/cloudevents+json
      payload:
        type: object
        required:
        - trackingNumber
        properties:
          orderId:
            type: string
          trackingNumber:
            type: string
      examples:
      - name: example
        payload:
          orderId: ord-1
          trackingNumber: TRK-1
